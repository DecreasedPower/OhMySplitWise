name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj

      - name: Build
        run: dotnet build SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
