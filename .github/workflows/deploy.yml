name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj

      - name: Build
        run: dotnet build SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-build

      - name: Build production image
        run: docker build --platform linux/amd64 --tag ohmysplitwise:${{ github.sha }} .

      - name: Export production image
        run: docker save ohmysplitwise:${{ github.sha }} | gzip > ohmysplitwise-${{ github.sha }}.tar.gz

      - name: Upload production image
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: ohmysplitwise-${{ github.sha }}.tar.gz
          retention-days: 1
          compression-level: 0

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://bot.ohmysplitwise.ru/health

    steps:
      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: production-image-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload production image
        run: scp ohmysplitwise-${{ github.sha }}.tar.gz deploy@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy with rollback
        run: ssh deploy@${{ secrets.VPS_HOST }} sudo /opt/ohmysplitwise/deploy.sh /tmp/ohmysplitwise-${{ github.sha }}.tar.gz ${{ github.sha }}

      - name: Verify production
        run: curl --fail --show-error --retry 5 --retry-delay 5 https://bot.ohmysplitwise.ru/health
