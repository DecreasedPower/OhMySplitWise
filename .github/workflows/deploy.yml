name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install frontend dependencies
        working-directory: ClientApp
        run: npm ci

      - name: Check frontend
        working-directory: ClientApp
        run: npm run lint && npm test && npm run build

      - name: Restore dependencies
        run: dotnet restore SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj

      - name: Build
        run: dotnet build SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test SplitMoneyTg.Tests/SplitMoneyTg.Tests.csproj --configuration Release --no-build

      - name: Build production image
        run: docker build --platform linux/amd64 --tag ohmysplitwise:${{ github.sha }} .

      - name: Export production image
        run: |
          docker image inspect ohmysplitwise:${{ github.sha }} --format '{{.Size}}' > image-size.txt
          docker save ohmysplitwise:${{ github.sha }} | gzip > ohmysplitwise-${{ github.sha }}.tar.gz
          stat --format='%s' ohmysplitwise-${{ github.sha }}.tar.gz > archive-size.txt

      - name: Upload production image
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: |
            ohmysplitwise-${{ github.sha }}.tar.gz
            image-size.txt
            archive-size.txt
          retention-days: 1
          compression-level: 0

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://bot.ohmysplitwise.ru:8443/health

    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: production-image-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install deployment script
        run: |
          scp deploy/deploy.sh deploy@${{ secrets.VPS_HOST }}:/tmp/ohmysplitwise-deploy.sh
          ssh deploy@${{ secrets.VPS_HOST }} 'sudo install -o root -g root -m 755 /tmp/ohmysplitwise-deploy.sh /opt/ohmysplitwise/deploy.sh && rm -f /tmp/ohmysplitwise-deploy.sh'

      - name: Check deployment capacity
        run: |
          image_size=$(<image-size.txt)
          archive_size=$(<archive-size.txt)
          [[ "$image_size" =~ ^[0-9]+$ && "$archive_size" =~ ^[0-9]+$ ]]
          ssh deploy@${{ secrets.VPS_HOST }} sudo /opt/ohmysplitwise/deploy.sh --check ${{ github.sha }} "$image_size" "$archive_size"

      - name: Deploy with rollback
        run: |
          image_size=$(<image-size.txt)
          archive_size=$(<archive-size.txt)
          ssh deploy@${{ secrets.VPS_HOST }} sudo /opt/ohmysplitwise/deploy.sh --deploy ${{ github.sha }} "$image_size" "$archive_size" < ohmysplitwise-${{ github.sha }}.tar.gz

      - name: Verify production
        run: curl --fail --show-error --retry 5 --retry-delay 5 https://bot.ohmysplitwise.ru:8443/health
